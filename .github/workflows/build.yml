name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.1
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Lint analyze (warnings only)
        run: flutter analyze --no-fatal-infos || true

      - name: Build split debug APKs (arm64 + arm, no x86)
        run: |
          flutter build apk --debug \
            --target-platform android-arm64,android-arm \
            --split-per-abi

      - name: List outputs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Rename & upload to Release (apk-build-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd build/app/outputs/flutter-apk
          # 主 APK 用 arm64（95%+ 现代 Android）
          cp app-arm64-v8a-debug.apk app-debug.apk
          ls -lh
          # 用 gh CLI 发 release，自动覆盖同 tag
          gh release upload apk-build-latest app-debug.apk \
            --clobber --repo $GITHUB_REPOSITORY
          # 副 ABI 也存起来，给老手机用
          gh release upload apk-build-latest app-armeabi-v7a-debug.apk \
            --clobber --repo $GITHUB_REPOSITORY || true
