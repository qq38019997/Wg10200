name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 显式授予 release 写权限（gh release upload --clobber / softprops
    # 都需要 contents:write，否则删/盖 asset 时 403）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.1
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Lint analyze (warnings only)
        run: flutter analyze --no-fatal-infos || true

      - name: Build split debug APKs (arm64 + arm, no x86)
        run: |
          flutter build apk --debug \
            --target-platform android-arm64,android-arm \
            --split-per-abi

      - name: Prepare assets
        run: |
          # 主 APK 用 arm64（95%+ 现代 Android）
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
             build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/

      # 用 softprops/action-gh-release：会自动 overwrite 同 tag 的同名 asset，
      # 且内置 token 权限处理（contents:write 已够）。无需 --clobber。
      - name: Upload to Release apk-build-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-latest
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          fail_on_unmatched_files: false
